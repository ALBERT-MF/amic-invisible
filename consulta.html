<div class="caixa">
 <h1>🎄🎁 Amic Invisible 2026</h1>
 <div id="resultat"></div>
 <a id="acceptar" class="boto" href="#">✅ Avisa que ja ho he vist</a>
 <p class="petit">📅 Entrega: 26/12 · 🤫 No ho diguis a ningú!</p>
 <p class="petit" id="marca"></p>

<script>
function sha256(ascii){function r(v,a){return(v>>>a)|(v<<(32-a))}var p=Math.pow,m=p(2,32),i,j,res='',w=[],L=ascii.length*8,
h=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pl=k.length,ic={};for(var c=2;pl<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;
h[pl]=(p(c,.5)*m)|0;k[pl++]=(p(c,1/3)*m)|0}}ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){
j=ascii.charCodeAt(i);if(j>>8)return;w[i>>2]|=j<<((3-i)%4)*8}w[w.length]=((L/m)|0);w[w.length]=L;h=h.slice(0,8);
for(j=0;j<w.length;){var W=w.slice(j,j+=16),o=h;h=h.slice(0,8);for(i=0;i<64;i++){var w15=W[i-15],w2=W[i-2],a=h[0],e=h[4],
t1=h[7]+(r(e,6)^r(e,11)^r(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(W[i]=(i<16)?W[i]:(W[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+W[i-7]+
(r(w2,17)^r(w2,19)^(w2>>>10)))|0),t2=(r(a,2)^r(a,13)^r(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0}
for(i=0;i<8;i++)h[i]=(h[i]+o[i])|0}for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(h[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}return res}
function desxifrar(token){
  const sal = token.slice(0, 8);
  let b64 = token.slice(8).replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const bin = atob(b64);
  let flux = '';
  for (let i = 0; flux.length < bin.length * 2; i++) flux += sha256('amic-' + sal + '-' + i);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ parseInt(flux.substr(i * 2, 2), 16);
  return new TextDecoder('utf-8', {fatal: true}).decode(bytes).split('\n');
}
function mostrar(){
  const out = document.getElementById('resultat');
  const boto = document.getElementById('acceptar');
  boto.style.display = 'none';
  document.getElementById('marca').textContent = '';
  let parts = null;
  try {
    const token = location.hash.slice(1);
    if (/^[0-9a-f]{8}[A-Za-z0-9_-]+$/.test(token)) parts = desxifrar(token);
  } catch (e) { parts = null; }
  if (!parts || parts.length !== 4 || !parts[0] || !parts[1]) {
    out.innerHTML = '<span class="error">Toca l\'enllaç que has rebut pel WhatsApp.</span>'; return;
  }
  const [qui, aQui, marca, telOrg] = parts;
  out.innerHTML = 'Hola ' + esc(qui) + '! Et toca fer el regal a:<span class="nom">' + esc(aQui) + '</span>';
  document.getElementById('marca').textContent = 'Sorteig ' + marca;
  if (telOrg) {
    const text = '🎁 Ja he vist el meu Amic Invisible! (' + qui + ')';
    boto.href = 'https://wa.me/' + telOrg + '?text=' + encodeURIComponent(text);
    boto.style.display = 'block';
  }
}
function esc(t){ return t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
window.addEventListener('hashchange', mostrar);
mostrar();
