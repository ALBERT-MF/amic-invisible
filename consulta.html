<!DOCTYPE html>
<html lang="ca"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amic Invisible 2026</title>
<style>
 body { margin:0; min-height:100vh; font-family: Segoe UI, Arial, sans-serif;
        background: linear-gradient(160deg,#7a1020,#b22222 60%,#1f5d3a); color:#fff;
        display:flex; align-items:center; justify-content:center; }
 .caixa { background:rgba(255,255,255,.12); border-radius:18px; padding:28px 22px;
          width:88%; max-width:380px; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,.3); }
 h1 { margin:0 0 6px; font-size:1.6em; }
 p { margin:8px 0; }
 input { width:70%; font-size:1.8em; text-align:center; letter-spacing:6px; text-transform:uppercase;
         padding:10px; border-radius:10px; border:none; margin:12px 0; }
 button { font-size:1.2em; padding:12px 26px; border:none; border-radius:10px; background:#25d366;
          color:#fff; font-weight:bold; }
 #resultat { margin-top:20px; font-size:1.2em; min-height:2em; }
 .nom { display:block; font-size:2em; font-weight:bold; margin-top:8px; color:#ffe680; }
 .error { color:#ffd2d2; }
 .petit { font-size:.85em; opacity:.8; }
</style></head><body>
<div class="caixa">
 <h1>🎄🎁 Amic Invisible 2026</h1>
 <p>Escriu el teu codi secret:</p>
 <input id="codi" maxlength="4" autocomplete="off" autocapitalize="characters">
 <br><button onclick="consultar()">Descobrir 🎁</button>
 <div id="resultat"></div>
 <p class="petit">📅 Entrega: 26/12 · 🤫 No ho diguis a ningú!</p>
</div>
<script>
const DADES = {"jugadors": ["Albert", "Lluïsa", "David"], "secrets": {"887ede458a7b6fd2": 900529169, "6e87e8dc1813a3af": 3609888089, "fecce220cdcc91d6": 723961817}};
function sha256(ascii){function r(v,a){return(v>>>a)|(v<<(32-a))}var p=Math.pow,m=p(2,32),i,j,res='',w=[],L=ascii.length*8,
h=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pl=k.length,ic={};for(var c=2;pl<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;
h[pl]=(p(c,.5)*m)|0;k[pl++]=(p(c,1/3)*m)|0}}ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){
j=ascii.charCodeAt(i);if(j>>8)return;w[i>>2]|=j<<((3-i)%4)*8}w[w.length]=((L/m)|0);w[w.length]=L;h=h.slice(0,8);
for(j=0;j<w.length;){var W=w.slice(j,j+=16),o=h;h=h.slice(0,8);for(i=0;i<64;i++){var w15=W[i-15],w2=W[i-2],a=h[0],e=h[4],
t1=h[7]+(r(e,6)^r(e,11)^r(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(W[i]=(i<16)?W[i]:(W[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+W[i-7]+
(r(w2,17)^r(w2,19)^(w2>>>10)))|0),t2=(r(a,2)^r(a,13)^r(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0}
for(i=0;i<8;i++)h[i]=(h[i]+o[i])|0}for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(h[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}return res}
function consultar(){
  const codi = document.getElementById('codi').value.trim().toUpperCase();
  const out = document.getElementById('resultat');
  const valor = DADES.secrets[sha256('amic-' + codi).slice(0,16)];
  if (codi.length !== 4 || valor === undefined) {
    out.innerHTML = '<span class="error">Aquest codi no existeix. Revisa\'l bé.</span>'; return;
  }
  const clau = parseInt(sha256('clau-' + codi).slice(0,8), 16);
  const nom = DADES.jugadors[(valor ^ clau) >>> 0];
  out.innerHTML = 'Et toca fer el regal a:<span class="nom">' + nom + '</span>';
}
document.getElementById('codi').addEventListener('keydown', e => { if (e.key === 'Enter') consultar(); });
function codiEnllac() {
  const c = location.hash.replace('#', '').trim().toUpperCase();
  if (/^[A-Z0-9]{4}$/.test(c)) { document.getElementById('codi').value = c; consultar(); }
}
window.addEventListener('hashchange', codiEnllac);
codiEnllac();
</script>
</body></html>
